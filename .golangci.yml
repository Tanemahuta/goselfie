version: "2"

linters:
  default: standard
  enable:
    - ginkgolinter
    - gochecknoglobals
    - gochecknoinits
    - gocritic
    - misspell
    - nolintlint
    - revive
  settings:
    nolintlint:
      require-explanation: true
      require-specific: true
    revive:
      enable-default-rules: true
      rules:
        - name: dot-imports
          arguments:
            - allowed-packages:
                - github.com/onsi/ginkgo/v2
                - github.com/onsi/gomega

run:
  timeout: 5m
