name: CodeQL

on:
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:

permissions: {}

jobs:
  codeql:
    uses: ./.github/workflows/codeql-callable.yml
    permissions:
      actions: read
      contents: read
      security-events: write
