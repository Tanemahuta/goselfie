name: pull request automation

on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize, labeled, ready_for_review]

permissions: {}

jobs:
  dependabot-metadata:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      update-type: ${{ steps.metadata.outputs.update-type }}
      dependency-type: ${{ steps.metadata.outputs.dependency-type }}
    steps:
      - name: Read Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ github.token }}

  approve-and-enable-auto-merge:
    needs: [dependabot-metadata]
    if: >-
      always() && github.event.pull_request.draft == false &&
      (needs.dependabot-metadata.result == 'success' ||
       needs.dependabot-metadata.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout trusted automation
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Approve eligible pull requests and enable native auto-merge
        uses: ./.github/actions/auto-merge
        with:
          token: ${{ github.token }}
          merge-token: ${{ secrets.AUTO_RELEASE_TOKEN || github.token }}
          dependabot-update: ${{ needs.dependabot-metadata.outputs.update-type }}
          dependabot-dependency-type: ${{ needs.dependabot-metadata.outputs.dependency-type }}
