name: pull request automation

on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize, labeled, ready_for_review]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  approve-and-enable-auto-merge:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted automation
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Approve eligible pull request and enable native auto-merge
        uses: ./.github/actions/auto-approve
        with:
          token: ${{ github.token }}
          merge-token: ${{ secrets.AUTO_RELEASE_TOKEN || github.token }}
