name: release

on:
  workflow_run:
    workflows: [verify, "CodeQL", "dependency quality"]
    types: [completed]
    branches: [main]

concurrency:
  group: release-${{ github.repository_id }}
  cancel-in-progress: false

permissions: {}

jobs:
  release:
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Check out trusted release gate
        uses: actions/checkout@v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Require all workflows to pass on the current commit
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: bash .github/scripts/release-gate.sh
      - name: Checkout verified commit and history
        if: steps.gate.outputs.ready == 'true'
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        if: steps.gate.outputs.ready == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install semantic-release
        if: steps.gate.outputs.ready == 'true'
        run: npm ci --prefix .github/release --ignore-scripts
      - name: Create release from commit messages
        if: steps.gate.outputs.ready == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./.github/release/node_modules/.bin/semantic-release
